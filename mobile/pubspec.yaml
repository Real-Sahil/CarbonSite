name: metricora_mobile
description: MetricOra field capture app for subcontractors, suppliers, and tipper hires.
publish_to: "none"
version: 1.0.1+2

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management — allow major upgrades so pub can resolve versions
  # compatible with whatever Dart SDK the active Flutter channel ships.
  flutter_riverpod: ">=2.6.1 <6.0.0"
  riverpod_annotation: ">=2.6.1 <6.0.0"

  # Navigation
  go_router: ^14.6.2

  # HTTP + auth
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2

  # Offline storage
  drift: ">=2.20.3 <6.0.0"
  sqlite3_flutter_libs: ">=0.5.24 <6.0.0"
  path_provider: ^2.1.4
  path: ^1.9.0

  # Connectivity
  connectivity_plus: ^6.1.2

  # Document capture
  camera: ^0.11.0
  image_picker: ^1.1.2
  image_cropper: ^12.2.1
  google_mlkit_text_recognition: ^0.15.0
  mobile_scanner: ^5.2.3
  geolocator: ^13.0.2

  # UI
  fl_chart: ^0.70.2
  share_plus: ^10.1.3

  # Push notifications (FCM)
  firebase_core: ^3.13.1
  firebase_messaging: ^15.2.5

  # Map + offline tile caching (GPS tag visualisation on capture form)
  flutter_map: ^7.0.2
  flutter_map_tile_caching: ^9.1.3
  latlong2: ^0.9.1

  # Utilities
  crypto: ^3.0.6
  freezed_annotation: ">=2.4.4 <6.0.0"
  json_annotation: ">=4.9.0 <9.0.0"
  intl: ^0.19.0
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # Wide ranges so pub can upgrade to the latest major that bundles an
  # analyzer version compatible with the installed Dart SDK.
  build_runner: ">=2.4.13 <6.0.0"
  freezed: ">=2.5.7 <6.0.0"
  json_serializable: ">=6.8.0 <9.0.0"
  riverpod_generator: ">=2.6.2 <6.0.0"
  drift_dev: ">=2.20.2 <6.0.0"

flutter:
  uses-material-design: true
