# Optional self-hosted services for CarbonSite
# Run separately from the main app: docker compose -f services/docker-compose.services.yml up
#
# Services:
#   - docuseal:     Document signing (supplier declarations, audit sign-offs)
#   - markitdown:   File-to-Markdown converter (PDF/Word/Excel document processing)
#
# Prerequisites: copy .env.services.example to .env.services and fill in values

version: "3.9"

services:
  # ---------------------------------------------------------------------------
  # DocuSeal — Open-source document signing
  # https://github.com/docusealco/docuseal
  #
  # Use cases for CarbonSite:
  #   - Subcontractor waste reporting agreements (signed before they get an invite link)
  #   - Scope 3 supplier data declarations (supplier signs off on submitted data)
  #   - Audit package sign-off (auditor digitally signs the final carbon report)
  #   - Data accuracy declarations for published inventory reports
  #
  # API integration: REST API at http://docuseal:3000/api
  # Webhook: POST to /api/orgs/[orgId]/webhooks/docuseal on document completion
  # ---------------------------------------------------------------------------
  docuseal:
    image: docuseal/docuseal:latest
    ports:
      - "3001:3000"
    volumes:
      - docuseal_data:/data
    environment:
      DATABASE_URL: ${DOCUSEAL_DATABASE_URL}     # Can share Postgres or use separate DB
      SECRET_KEY_BASE: ${DOCUSEAL_SECRET_KEY}
      FORCE_SSL: "false"                          # Set true behind reverse proxy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ---------------------------------------------------------------------------
  # MarkItDown API — Microsoft's file-to-Markdown converter
  # https://github.com/microsoft/markitdown
  #
  # Use cases for CarbonSite:
  #   - Convert uploaded PDFs (waste tickets, utility bills) to text for import pipeline
  #   - Convert XLSX factor library imports to processable text
  #   - Pre-process delivery notes and fuel receipts before OCR field extraction
  #   - Supplement Flutter's ML Kit OCR for server-side document re-processing
  #
  # Exposed at http://markitdown:8000/convert
  # Called from BullMQ imports worker before Zod field validation
  # ---------------------------------------------------------------------------
  markitdown:
    build:
      context: ./markitdown
      dockerfile: Dockerfile
    ports:
      - "8001:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  docuseal_data:
