name: 'carbonsite_dbt'
version: '1.0.0'
config-version: 2
profile: 'carbonsite'
model-paths: ['models']
seed-paths: ['seeds']
test-paths: ['tests']
macro-paths: ['macros']
snapshot-paths: ['snapshots']
target-path: 'target'
clean-targets:
  - 'target'
  - 'dbt_packages'

models:
  carbonsite_dbt:
    staging:
      +materialized: view
      +tags: ['staging']
    marts:
      +materialized: table
      +tags: ['marts']
      +schema: 'marts'

on-run-start: "{{ log('Starting dbt run for CarbonSite', info=true) }}"
on-run-end: "{{ log('Completed dbt run for CarbonSite', info=true) }}"

vars:
  calculation_run_id: 'null'
  start_date: '2024-01-01'
  end_date: '2026-12-31'
