# dbt project for CarbonSite — SQL transformation orchestration
# Builds immutable fact tables, aggregates, and tests from emission calculations

name: 'carbonsite_dbt'
version: '1.0.0'
config-version: 2

profile: 'carbonsite'

model-paths: ["models"]
test-paths: ["tests"]
data-paths: ["seeds"]
macro-paths: ["macros"]
target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

quoting:
  identifier: false
  schema: false

models:
  carbonsite_dbt:
    staging:
      materialized: view
    marts:
      materialized: table
      indexes:
        - columns: ["organization_id", "reporting_period_id"]
        - columns: ["facility_id"]
        - columns: ["calculation_run_id"]

seeds:
  quote_columns: false

tests:
  store_failures: true
  warn_error_threshold: 0.05
