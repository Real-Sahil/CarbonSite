name: Mobile release builds

concurrency:
  group: mobile-release-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-build.yml"
    tags:
      - "v*"
      - "mobile-v*"
  workflow_dispatch:
    inputs:
      api_base_url:
        description: Production MetricOra web URL used by the mobile app.
        required: true
        default: https://metricora-rosy.vercel.app
      build_android:
        description: Build Android APK and app bundle artifacts.
        type: boolean
        required: true
        default: true
      build_ios:
        description: Build an iOS artifact on macOS (signed .ipa if METRICORA_IOS_* secrets are set, otherwise an unsigned .app).
        type: boolean
        required: true
        default: true
      ios_export_method:
        description: Export method for the signed IPA (only used when METRICORA_IOS_* signing secrets are configured).
        type: choice
        required: true
        default: app-store
        options:
          - app-store
          - ad-hoc
          - development
          - enterprise

env:
  METRICORA_API_BASE_URL: ${{ inputs.api_base_url || vars.METRICORA_API_BASE_URL || 'https://metricora-rosy.vercel.app' }}

jobs:
  android:
    name: Android release artifacts
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_android }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.0"
          channel: stable
          cache: true
      - name: Inject google-services.json
        env:
          METRICORA_GOOGLE_SERVICES_JSON: ${{ secrets.METRICORA_GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$METRICORA_GOOGLE_SERVICES_JSON" ]; then
            echo "$METRICORA_GOOGLE_SERVICES_JSON" > android/app/google-services.json
            echo "google-services.json injected from METRICORA_GOOGLE_SERVICES_JSON secret."
          else
            echo "::warning::METRICORA_GOOGLE_SERVICES_JSON secret is not set. FCM push notifications will not work. Add the secret in GitHub repo Settings > Secrets."
            echo '{"project_info":{"project_number":"000000000000","project_id":"metricora-stub","storage_bucket":"metricora-stub.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:000000000000:android:0000000000000000000000","android_client_info":{"package_name":"app.metricora.metricora_mobile"}},"oauth_client":[],"api_key":[{"current_key":"stub-key-replace-with-real"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}' > android/app/google-services.json
          fi
      - run: flutter pub get
      - name: Generate code (drift)
        run: dart run build_runner build --verbose --delete-conflicting-outputs 2>&1 | tee build_runner.log
      - name: Upload build_runner logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-runner-logs-android
          path: mobile/build_runner.log
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - name: Check Android release signing secrets
        env:
          METRICORA_ANDROID_KEYSTORE_BASE64: ${{ secrets.METRICORA_ANDROID_KEYSTORE_BASE64 }}
          METRICORA_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.METRICORA_ANDROID_KEYSTORE_PASSWORD }}
          METRICORA_ANDROID_KEY_ALIAS: ${{ secrets.METRICORA_ANDROID_KEY_ALIAS }}
          METRICORA_ANDROID_KEY_PASSWORD: ${{ secrets.METRICORA_ANDROID_KEY_PASSWORD }}
        run: |
          missing=0
          for name in METRICORA_ANDROID_KEYSTORE_BASE64 METRICORA_ANDROID_KEYSTORE_PASSWORD METRICORA_ANDROID_KEY_ALIAS METRICORA_ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::warning::$name is not set; Android artifacts will use the debug signing fallback and are not Play Store ready."
              missing=1
            fi
          done
          if [ "$missing" -eq 0 ]; then
            echo "METRICORA_ANDROID_SIGNING_READY=true" >> "$GITHUB_ENV"
          fi
      - name: Configure Android release signing
        if: env.METRICORA_ANDROID_SIGNING_READY == 'true'
        env:
          METRICORA_ANDROID_KEYSTORE_BASE64: ${{ secrets.METRICORA_ANDROID_KEYSTORE_BASE64 }}
          METRICORA_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.METRICORA_ANDROID_KEYSTORE_PASSWORD }}
          METRICORA_ANDROID_KEY_ALIAS: ${{ secrets.METRICORA_ANDROID_KEY_ALIAS }}
          METRICORA_ANDROID_KEY_PASSWORD: ${{ secrets.METRICORA_ANDROID_KEY_PASSWORD }}
        run: |
          echo "$METRICORA_ANDROID_KEYSTORE_BASE64" | base64 --decode > android/metricora-release.keystore
          {
            echo "storeFile=metricora-release.keystore"
            echo "storePassword=$METRICORA_ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$METRICORA_ANDROID_KEY_ALIAS"
            echo "keyPassword=$METRICORA_ANDROID_KEY_PASSWORD"
          } > android/key.properties
      - run: flutter build apk --release --no-tree-shake-icons --dart-define=METRICORA_API_BASE_URL="$METRICORA_API_BASE_URL"
      - run: flutter build appbundle --release --no-tree-shake-icons --dart-define=METRICORA_API_BASE_URL="$METRICORA_API_BASE_URL"
      - uses: actions/upload-artifact@v7
        with:
          name: metricora-android-release
          path: |
            mobile/build/app/outputs/flutter-apk/*.apk
            mobile/build/app/outputs/bundle/release/*.aab
          if-no-files-found: error

  ios:
    name: iOS release artifact
    # iOS builds only on tags or manual dispatch — branch pushes build Android only.
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.build_ios) || startsWith(github.ref, 'refs/tags/') }}
    runs-on: macos-14
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.0"
          channel: stable
          cache: true
      - name: Inject google-services.json
        env:
          METRICORA_GOOGLE_SERVICES_JSON: ${{ secrets.METRICORA_GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$METRICORA_GOOGLE_SERVICES_JSON" ]; then
            echo "$METRICORA_GOOGLE_SERVICES_JSON" > android/app/google-services.json
          else
            echo '{"project_info":{"project_number":"000000000000","project_id":"metricora-stub","storage_bucket":"metricora-stub.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:000000000000:android:0000000000000000000000","android_client_info":{"package_name":"app.metricora.metricora_mobile"}},"oauth_client":[],"api_key":[{"current_key":"stub-key-replace-with-real"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}' > android/app/google-services.json
          fi
      - run: flutter pub get
      - name: Clean pub cache (macOS)
        run: flutter pub cache repair
      - name: Generate code (drift)
        run: dart run build_runner build --verbose --delete-conflicting-outputs 2>&1 | tee build_runner.log
      - name: Upload build_runner logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-runner-logs-ios
          path: mobile/build_runner.log
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - name: Check iOS signing secrets
        env:
          METRICORA_IOS_DIST_CERTIFICATE_BASE64: ${{ secrets.METRICORA_IOS_DIST_CERTIFICATE_BASE64 }}
          METRICORA_IOS_DIST_CERTIFICATE_PASSWORD: ${{ secrets.METRICORA_IOS_DIST_CERTIFICATE_PASSWORD }}
          METRICORA_IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.METRICORA_IOS_PROVISIONING_PROFILE_BASE64 }}
          METRICORA_IOS_TEAM_ID: ${{ secrets.METRICORA_IOS_TEAM_ID }}
        run: |
          missing=0
          for name in METRICORA_IOS_DIST_CERTIFICATE_BASE64 METRICORA_IOS_DIST_CERTIFICATE_PASSWORD METRICORA_IOS_PROVISIONING_PROFILE_BASE64 METRICORA_IOS_TEAM_ID; do
            if [ -z "${!name}" ]; then
              echo "::warning::$name is not set; iOS build will fall back to an unsigned .app artifact (no .ipa). Add the four METRICORA_IOS_* secrets in repo Settings > Secrets to enable signed IPA builds."
              missing=1
            fi
          done
          if [ "$missing" -eq 0 ]; then
            echo "METRICORA_IOS_SIGNING_READY=true" >> "$GITHUB_ENV"
          fi
      - name: Import signing certificate and provisioning profile
        if: env.METRICORA_IOS_SIGNING_READY == 'true'
        env:
          METRICORA_IOS_DIST_CERTIFICATE_BASE64: ${{ secrets.METRICORA_IOS_DIST_CERTIFICATE_BASE64 }}
          METRICORA_IOS_DIST_CERTIFICATE_PASSWORD: ${{ secrets.METRICORA_IOS_DIST_CERTIFICATE_PASSWORD }}
          METRICORA_IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.METRICORA_IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/metricora_dist.p12"
          PROFILE_PATH="$RUNNER_TEMP/metricora.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/metricora-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"

          echo -n "$METRICORA_IOS_DIST_CERTIFICATE_BASE64" | base64 -D > "$CERT_PATH"
          echo -n "$METRICORA_IOS_PROVISIONING_PROFILE_BASE64" | base64 -D > "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$METRICORA_IOS_DIST_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s login.keychain-db "$KEYCHAIN_PATH"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          security cms -D -i "$PROFILE_PATH" > "$RUNNER_TEMP/profile.plist"
          PROFILE_UUID="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")"
          PROFILE_NAME="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          echo "METRICORA_IOS_KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "METRICORA_IOS_PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
      - name: Generate ExportOptions.plist
        if: env.METRICORA_IOS_SIGNING_READY == 'true'
        env:
          METRICORA_IOS_TEAM_ID: ${{ secrets.METRICORA_IOS_TEAM_ID }}
        run: |
          cat > ios/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>${{ inputs.ios_export_method || 'app-store' }}</string>
            <key>teamID</key>
            <string>$METRICORA_IOS_TEAM_ID</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>uploadSymbols</key>
            <true/>
            <key>provisioningProfiles</key>
            <dict>
              <key>app.metricora.metricoraMobile</key>
              <string>$METRICORA_IOS_PROFILE_NAME</string>
            </dict>
          </dict>
          </plist>
          PLIST
      - name: Apply CI signing overrides
        if: env.METRICORA_IOS_SIGNING_READY == 'true'
        env:
          METRICORA_IOS_TEAM_ID: ${{ secrets.METRICORA_IOS_TEAM_ID }}
        run: |
          {
            echo "DEVELOPMENT_TEAM=$METRICORA_IOS_TEAM_ID"
            echo "CODE_SIGN_STYLE=Manual"
            echo "CODE_SIGN_IDENTITY=Apple Distribution"
            echo "PROVISIONING_PROFILE_SPECIFIER=$METRICORA_IOS_PROFILE_NAME"
          } >> ios/Flutter/Release.xcconfig
      - name: Build signed IPA
        if: env.METRICORA_IOS_SIGNING_READY == 'true'
        run: flutter build ipa --release --no-tree-shake-icons --export-options-plist=ios/ExportOptions.plist --dart-define=METRICORA_API_BASE_URL="$METRICORA_API_BASE_URL"
      - name: Build unsigned iOS app (no signing secrets configured)
        if: env.METRICORA_IOS_SIGNING_READY != 'true'
        run: flutter build ios --release --no-codesign --no-tree-shake-icons --dart-define=METRICORA_API_BASE_URL="$METRICORA_API_BASE_URL"
      - name: Package unsigned iOS app
        if: env.METRICORA_IOS_SIGNING_READY != 'true'
        run: ditto -c -k --sequesterRsrc --keepParent build/ios/iphoneos/Runner.app build/ios/iphoneos/metricora-ios-unsigned.zip
      - name: Upload signed IPA artifact
        if: env.METRICORA_IOS_SIGNING_READY == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: metricora-ios-release
          path: mobile/build/ios/ipa/*.ipa
          if-no-files-found: error
      - name: Upload unsigned iOS artifact
        if: env.METRICORA_IOS_SIGNING_READY != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: metricora-ios-unsigned-release
          path: mobile/build/ios/iphoneos/metricora-ios-unsigned.zip
          if-no-files-found: error
      - name: Clean up signing keychain
        if: always()
        run: |
          if [ -n "${METRICORA_IOS_KEYCHAIN_PATH:-}" ]; then
            security delete-keychain "$METRICORA_IOS_KEYCHAIN_PATH" || true
          fi
