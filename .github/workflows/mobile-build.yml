name: Mobile release builds

concurrency:
  group: mobile-release-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-build.yml"
    tags:
      - "v*"
      - "mobile-v*"
  workflow_dispatch:
    inputs:
      api_base_url:
        description: Production MetricOra web URL used by the mobile app.
        required: true
        default: https://metricora-rosy.vercel.app
      build_android:
        description: Build Android APK and app bundle artifacts.
        type: boolean
        required: true
        default: true
      build_ios:
        description: Build an iOS artifact on macOS (signed .ipa if METRICORA_IOS_* secrets are set, otherwise an unsigned .app).
        type: boolean
        required: true
        default: true
      ios_export_method:
        description: Export method for the signed IPA (only used when METRICORA_IOS_* signing secrets are configured).
        type: choice
        required: true
        default: app-store
        options:
          - app-store
          - ad-hoc
          - development
          - enterprise

env:
  METRICORA_API_BASE_URL: ${{ inputs.api_base_url || vars.METRICORA_API_BASE_URL || 'https://metricora-rosy.vercel.app' }}

jobs:
  android:
    name: Android release artifacts
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.build_android) || startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.0"
          channel: stable
          cache: true
      - name: Inject google-services.json
        env:
          METRICORA_GOOGLE_SERVICES_JSON: ${{ secrets.METRICORA_GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$METRICORA_GOOGLE_SERVICES_JSON" ]; then
            echo "$METRICORA_GOOGLE_SERVICES_JSON" > android/app/google-services.json
            echo "google-services.json injected from METRICORA_GOOGLE_SERVICES_JSON secret."
          else
            echo "::warning::METRICORA_GOOGLE_SERVICES_JSON secret is not set. FCM push notifications will not work. Add the secret in GitHub repo Settings > Secrets."
            echo '{"project_info":{"project_number":"000000000000","project_id":"metricora-stub","storage_bucket":"metricora-stub.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:000000000000:android:0000000000000000000000","android_client_info":{"package_name":"app.metricora.metricora_mobile"}},"oauth_client":[],"api_key":[{"current_key":"stub-key-replace-with-real"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}' > android/app/google-services.json
          fi
      - run: flutter pub get
      - name: Generate code (drift)
        run: dart run build_runner build --verbose --delete-conflicting-outputs 2>&1 | tee build_runner.log
      - name: Upload build_runner logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-runner-logs-android
          path: mobile/build_runner.log
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - name: Check Android release signing secrets
        env:
          METRICORA_ANDROID_KEYSTORE_BASE64: ${{ secrets.METRICORA_ANDROID_KEYSTORE_BASE64 }}
          METRICORA_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.METRICORA_ANDROID_KEYSTORE_PASSWORD }}
          METRICORA_ANDROID_KEY_ALIAS: ${{ secrets.METRICORA_ANDROID_KEY_ALIAS }}
          METRICORA_ANDROID_KEY_PASSWORD: ${{ secrets.METRICORA_ANDROID_KEY_PASSWORD }}
        run: |
          missing=0
          for name in METRICORA_ANDROID_KEYSTORE_BASE64 METRICORA_ANDROID_KEYSTORE_PASSWORD METRICORA_ANDROID_KEY_ALIAS METRICORA_ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::warning::$name is not set; Android artifacts will use the debug signing fallback and are not Play Store ready."
              missing=1
            fi
          done
          if [ "$missing" -eq 0 ]; then
            echo "METRICORA_ANDROID_SIGNING_READY=true" >> "$GITHUB_ENV"
          fi
      - name: Configure Android release signing
        if: env.METRICORA_ANDROID_SIGNING_READY == 'true'
        env:
          METRICORA_ANDROID_KEYSTORE_BASE64: ${{ secrets.METRICORA_ANDROID_KEYSTORE_BASE64 }}
          METRICORA_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.METRICORA_ANDROID_KEYSTORE_PASSWORD }}
          METRICORA_ANDROID_KEY_ALIAS: ${{ secrets.METRICORA_ANDROID_KEY_ALIAS }}
          METRICORA_ANDROID_KEY_PASSWORD: ${{ secrets.METRICORA_ANDROID_KEY_PASSWORD }}
        run: |
          echo "$METRICORA_ANDROID_KEYSTORE_BASE64" | base64 --decode > android/metricora-release.keystore
          {
            echo "storeFile=metricora-release.keystore"
            echo "storePassword=$METRICORA_ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$METRICORA_ANDROID_KEY_ALIAS"
            echo "keyPassword=$METRICORA_ANDROID_KEY_PASSWORD"
          } > android/key.properties
      - run: flutter build apk --release --no-tree-shake-icons --dart-define=METRICORA_API_BASE_URL="$METRICORA_API_BASE_URL"
      - run: flutter build appbundle --release --no-tree-shake-icons --dart-define=METRICORA_API_BASE_URL="$METRICORA_API_BASE_URL"
      - uses: actions/upload-artifact@v4
        with:
          name: metricora-android-release
          path: |
            mobile/build/app/outputs/flutter-apk/*.apk
            mobile/build/app/outputs/bundle/release/*.aab
          if-no-files-found: error

  ios:
    name: iOS release artifact
    # iOS builds only on tags or manual dispatch — branch pushes build Android only.
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.build_ios) || startsWith(github.ref, 'refs/tags/') }}
    runs-on: macos-14
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.0"
          channel: stable
          cache: true
      - name: Inject google-services.json
        env:
          METRICORA_GOOGLE_SERVICES_JSON: ${{ secrets.METRICORA_GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$METRICORA_GOOGLE_SERVICES_JSON" ]; then
            echo "$METRICORA_GOOGLE_SERVICES_JSON" > android/app/google-services.json
          else
            echo '{"project_info":{"project_number":"000000000000","project_id":"metricora-stub","storage_bucket":"metricora-stub.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:000000000000:android:0000000000000000000000","android_client_info":{"package_name":"app.metricora.metricora_mobile"}},"oauth_client":[],"api_key":[{"current_key":"stub-key-replace-with-real"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}' > android/app/google-services.json
          fi
      - name: Inject GoogleService-Info.plist (iOS FCM)
        env:
          METRICORA_IOS_GOOGLE_SERVICES_PLIST: ${{ secrets.METRICORA_IOS_GOOGLE_SERVICES_PLIST }}
        run: |
          if [ -n "$METRICORA_IOS_GOOGLE_SERVICES_PLIST" ]; then
            echo "$METRICORA_IOS_GOOGLE_SERVICES_PLIST" > ios/Runner/GoogleService-Info.plist
            echo "GoogleService-Info.plist injected from secret."
          else
            echo "::warning::METRICORA_IOS_GOOGLE_SERVICES_PLIST not set — using stub. FCM push notifications will not work."
            cat > ios/Runner/GoogleService-Info.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>API_KEY</key><string>stub-key-replace-with-real</string>
            <key>GCM_SENDER_ID</key><string>000000000000</string>
            <key>PLIST_VERSION</key><string>1</string>
            <key>BUNDLE_ID</key><string>app.metricora.metricoraMobile</string>
            <key>PROJECT_ID</key><string>metricora-stub</string>
            <key>STORAGE_BUCKET</key><string>metricora-stub.appspot.com</string>
            <key>IS_ADS_ENABLED</key><false/>
            <key>IS_ANALYTICS_ENABLED</key><false/>
            <key>IS_APPINVITE_ENABLED</key><true/>
            <key>IS_GCM_ENABLED</key><true/>
            <key>IS_SIGNIN_ENABLED</key><true/>
            <key>GOOGLE_APP_ID</key><string>1:000000000000:ios:0000000000000000000000</string>
          </dict>
          </plist>
          PLIST
          fi
      - run: flutter pub get
      - name: Clean pub cache (macOS)
        run: flutter pub cache repair
      - name: Generate code (drift)
        run: dart run build_runner build --verbose --delete-conflicting-outputs 2>&1 | tee build_runner.log
      - name: Upload build_runner logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-runner-logs-ios
          path: mobile/build_runner.log
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - name: Check iOS signing secrets
        env:
          METRICORA_IOS_DIST_CERTIFICATE_BASE64: ${{ secrets.METRICORA_IOS_DIST_CERTIFICATE_BASE64 }}
          METRICORA_IOS_DIST_CERTIFICATE_PASSWORD: ${{ secrets.METRICORA_IOS_DIST_CERTIFICATE_PASSWORD }}
          METRICORA_IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.METRICORA_IOS_PROVISIONING_PROFILE_BASE64 }}
          METRICORA_IOS_TEAM_ID: ${{ secrets.METRICORA_IOS_TEAM_ID }}
        run: |
          missing=0
          for name in METRICORA_IOS_DIST_CERTIFICATE_BASE64 METRICORA_IOS_DIST_CERTIFICATE_PASSWORD METRICORA_IOS_PROVISIONING_PROFILE_BASE64 METRICORA_IOS_TEAM_ID; do
            if [ -z "${!name}" ]; then
              echo "::warning::$name is not set; iOS build will fall back to an unsigned .app artifact (no .ipa). Add the four METRICORA_IOS_* secrets in repo Settings > Secrets to enable signed IPA builds."
              missing=1
            fi
          done
          if [ "$missing" -eq 0 ]; then
            echo "METRICORA_IOS_SIGNING_READY=true" >> "$GITHUB_ENV"
          fi
      - name: Import signing certificate and provisioning profile
        if: env.METRICORA_IOS_SIGNING_READY == 'true'
        env:
          METRICORA_IOS_DIST_CERTIFICATE_BASE64: ${{ secrets.METRICORA_IOS_DIST_CERTIFICATE_BASE64 }}
          METRICORA_IOS_DIST_CERTIFICATE_PASSWORD: ${{ secrets.METRICORA_IOS_DIST_CERTIFICATE_PASSWORD }}
          METRICORA_IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.METRICORA_IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/metricora_dist.p12"
          PROFILE_PATH="$RUNNER_TEMP/metricora.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/metricora-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"

          # Decode with Python3 — more robust than LibreSSL openssl base64 on macos-14
          printf '%s' "$METRICORA_IOS_DIST_CERTIFICATE_BASE64" > "$RUNNER_TEMP/cert_raw.b64"
          python3 -c "import base64,sys; d=''.join(open(sys.argv[1]).read().split()); print(len(d),'chars cert b64'); open(sys.argv[2],'wb').write(base64.b64decode(d+'='*(-len(d)%4)))" "$RUNNER_TEMP/cert_raw.b64" "$CERT_PATH"
          printf '%s' "$METRICORA_IOS_PROVISIONING_PROFILE_BASE64" > "$RUNNER_TEMP/profile_raw.b64"
          python3 -c "import base64,sys; d=''.join(open(sys.argv[1]).read().split()); print(len(d),'chars profile b64'); open(sys.argv[2],'wb').write(base64.b64decode(d+'='*(-len(d)%4)))" "$RUNNER_TEMP/profile_raw.b64" "$PROFILE_PATH"

          # Strip all surrounding whitespace from password (GitHub Secrets UI can add trailing newline)
          # Python3 strips more thoroughly than tr; prints the trimmed length for diagnostics.
          printf '%s' "$METRICORA_IOS_DIST_CERTIFICATE_PASSWORD" > "$RUNNER_TEMP/password_raw.txt"
          python3 -c "import sys; p=open(sys.argv[1]).read().strip(); print(len(p),'chars password (after strip; value masked by GitHub)'); open(sys.argv[2],'w').write(p)" "$RUNNER_TEMP/password_raw.txt" "$RUNNER_TEMP/password_clean.txt"
          CERT_PASSWORD="$(cat "$RUNNER_TEMP/password_clean.txt")"

          # Pre-check password against p12 before touching the keychain.
          # 'openssl pkcs12 -noout' exits 0 on correct password, non-zero on wrong password.
          # -legacy needed for PKCS12 files encrypted with RC2/3DES (common for Apple exports).
          if openssl pkcs12 -noout -in "$CERT_PATH" -passin "pass:$CERT_PASSWORD" 2>/dev/null || \
             openssl pkcs12 -noout -legacy -in "$CERT_PATH" -passin "pass:$CERT_PASSWORD" 2>/dev/null; then
            echo "P12 password pre-check: PASSED"
          else
            echo "::error::P12 password pre-check FAILED. The METRICORA_IOS_DIST_CERTIFICATE_PASSWORD secret does not match the .p12 certificate. Update the secret to the correct export password and re-run."
            exit 1
          fi

          # macOS security import only supports legacy PKCS12 (RC2/3DES encryption).
          # Modern p12 files use AES-256/PBKDF2 (PBES2), which security import rejects with a
          # misleading "wrong password" error even when the password is correct.
          # Re-export to legacy format using Homebrew OpenSSL 3 (pre-installed on macos-14).
          BREW_SSL=""
          if command -v brew >/dev/null 2>&1; then
            BREW_PREFIX="$(brew --prefix openssl@3 2>/dev/null)"
            [ -f "$BREW_PREFIX/bin/openssl" ] && BREW_SSL="$BREW_PREFIX/bin/openssl"
          fi
          [ -z "$BREW_SSL" ] && [ -f /opt/homebrew/opt/openssl@3/bin/openssl ] && BREW_SSL=/opt/homebrew/opt/openssl@3/bin/openssl
          if [ -n "$BREW_SSL" ]; then
            echo "Homebrew OpenSSL at $BREW_SSL — converting p12 to legacy format (3DES/RC2)..."
            "$BREW_SSL" pkcs12 -in "$CERT_PATH" -passin "pass:$CERT_PASSWORD" -nodes -out "$RUNNER_TEMP/cert_pem.pem" 2>/dev/null
            "$BREW_SSL" pkcs12 -legacy -export -in "$RUNNER_TEMP/cert_pem.pem" -out "$RUNNER_TEMP/metricora_dist_legacy.p12" -passout "pass:$CERT_PASSWORD"
            rm -f "$RUNNER_TEMP/cert_pem.pem"
            IMPORT_CERT_PATH="$RUNNER_TEMP/metricora_dist_legacy.p12"
            echo "Legacy p12 ready"
          else
            echo "::warning::Homebrew OpenSSL not found — using original p12 (may fail on modern encryption)"
            IMPORT_CERT_PATH="$CERT_PATH"
          fi

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$IMPORT_CERT_PATH" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s login.keychain-db "$KEYCHAIN_PATH"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          # Extract UUID/Name by scanning raw binary (single-line to avoid YAML indent issues).
          # security cms -D fails -8183 on this profile; plist XML is plaintext inside CMS.
          python3 -c 'import re,sys; data=open(sys.argv[1],"rb").read(); m=re.search(b"<key>UUID</key>\s*<string>([^<]+)</string>",data); uuid=m.group(1).decode().strip() if m else ""; m2=re.search(b"<key>Name</key>\s*<string>([^<]+)</string>",data); name=m2.group(1).decode().strip() if m2 else "MetricOra Distribution"; print("PROFILE_UUID="+uuid); print("PROFILE_NAME="+name)' "$PROFILE_PATH" > "$RUNNER_TEMP/profile_meta.txt"
          cat "$RUNNER_TEMP/profile_meta.txt"
          PROFILE_UUID="$(grep '^PROFILE_UUID=' "$RUNNER_TEMP/profile_meta.txt" | cut -d= -f2)"
          PROFILE_NAME="$(grep '^PROFILE_NAME=' "$RUNNER_TEMP/profile_meta.txt" | cut -d= -f2)"
          if [ -z "$PROFILE_UUID" ]; then
            echo "::error::Could not extract UUID from provisioning profile binary"
            exit 1
          fi
          echo "Profile UUID: $PROFILE_UUID  Name: $PROFILE_NAME"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          echo "METRICORA_IOS_KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "METRICORA_IOS_PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "METRICORA_IOS_PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
      - name: Generate ExportOptions.plist
        if: env.METRICORA_IOS_SIGNING_READY == 'true'
        env:
          METRICORA_IOS_TEAM_ID: ${{ secrets.METRICORA_IOS_TEAM_ID }}
        run: |
          cat > ios/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>${{ inputs.ios_export_method || 'app-store' }}</string>
            <key>teamID</key>
            <string>$METRICORA_IOS_TEAM_ID</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>uploadSymbols</key>
            <true/>
            <key>provisioningProfiles</key>
            <dict>
              <key>app.metricora.metricoraMobile</key>
              <string>$METRICORA_IOS_PROFILE_NAME</string>
            </dict>
          </dict>
          </plist>
          PLIST
      - name: Apply CI signing overrides
        if: env.METRICORA_IOS_SIGNING_READY == 'true'
        env:
          METRICORA_IOS_TEAM_ID: ${{ secrets.METRICORA_IOS_TEAM_ID }}
        run: |
          {
            echo "DEVELOPMENT_TEAM=$METRICORA_IOS_TEAM_ID"
            echo "CODE_SIGN_STYLE=Manual"
            echo "CODE_SIGN_IDENTITY=Apple Distribution"
            echo "PROVISIONING_PROFILE_SPECIFIER=$METRICORA_IOS_PROFILE_UUID"
          } >> ios/Flutter/Release.xcconfig
      - name: Build signed IPA
        if: env.METRICORA_IOS_SIGNING_READY == 'true'
        run: flutter build ipa --release --no-tree-shake-icons --export-options-plist=ios/ExportOptions.plist --dart-define=METRICORA_API_BASE_URL="$METRICORA_API_BASE_URL"
      - name: Build unsigned iOS app (no signing secrets configured)
        if: env.METRICORA_IOS_SIGNING_READY != 'true'
        run: flutter build ios --release --no-codesign --no-tree-shake-icons --dart-define=METRICORA_API_BASE_URL="$METRICORA_API_BASE_URL"
      - name: Package unsigned iOS app
        if: env.METRICORA_IOS_SIGNING_READY != 'true'
        run: ditto -c -k --sequesterRsrc --keepParent build/ios/iphoneos/Runner.app build/ios/iphoneos/metricora-ios-unsigned.zip
      - name: Upload signed IPA artifact
        if: env.METRICORA_IOS_SIGNING_READY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: metricora-ios-release
          path: mobile/build/ios/ipa/*.ipa
          if-no-files-found: error
      - name: Upload unsigned iOS artifact
        if: env.METRICORA_IOS_SIGNING_READY != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: metricora-ios-unsigned-release
          path: mobile/build/ios/iphoneos/metricora-ios-unsigned.zip
          if-no-files-found: error
      - name: Clean up signing keychain
        if: always()
        run: |
          if [ -n "${METRICORA_IOS_KEYCHAIN_PATH:-}" ]; then
            security delete-keychain "$METRICORA_IOS_KEYCHAIN_PATH" || true
          fi
