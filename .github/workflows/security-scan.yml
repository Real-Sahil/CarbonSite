name: Security scan

# Secret scanning (Gitleaks) and dependency vulnerability scanning (OSV-Scanner)
# alongside Dependabot (CodeQL, codeql.yml, is manual while the repository is
# private without Advanced Security).
#
# - Gitleaks blocks: it scans the checked-out tree and, on a pull request, every
#   commit the PR adds. Known non-secrets are allowlisted in .gitleaks.toml.
#   Older history is not rescanned on each run; a real credential found there
#   is rotated, not allowlisted.
# - OSV-Scanner lists known vulnerabilities for every lockfile (pnpm, Python for
#   api/forecast.py, the Flutter app, videos/) in the job summary. It warns
#   but does not fail the build yet: triage the first results, then make
#   exit code 1 fail. It runs the pinned CLI directly instead of Google's
#   reusable workflow, which uploads a SARIF artifact and to code scanning,
#   and failed when artifact storage was full or code scanning was off.
#   pnpm audit in ci.yml still blocks high-severity production advisories.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "30 6 * * 1"

permissions:
  contents: read

jobs:
  gitleaks:
    name: Secrets — Gitleaks
    # The weekly run is for OSV (new advisories on unchanged lockfiles); the
    # tree has not changed since the last push, so Gitleaks skips it.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.28.0
      GITLEAKS_SHA256: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Gitleaks
        run: |
          curl -sSfL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar xzf gitleaks.tgz gitleaks
          rm gitleaks.tgz
      - name: Scan the working tree
        run: ./gitleaks dir . --config .gitleaks.toml --no-banner --redact --exit-code 1
      - name: Scan the commits this pull request adds
        if: github.event_name == 'pull_request'
        run: |
          ./gitleaks git . --config .gitleaks.toml --no-banner --redact --exit-code 1 \
            --log-opts="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"

  osv:
    name: Dependencies — OSV-Scanner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OSV_VERSION: 2.2.2
      OSV_SHA256: c799274b682e0437c802d4714a136ad09b39c65547c460049ba5358d28afa576
    steps:
      - uses: actions/checkout@v4
      - name: Install OSV-Scanner
        run: |
          curl -sSfL -o osv-scanner "https://github.com/google/osv-scanner/releases/download/v${OSV_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SHA256}  osv-scanner" | sha256sum -c -
          chmod +x osv-scanner
      - name: Scan every lockfile (report only)
        # Every lockfile in the repo: pnpm-lock.yaml, requirements*.txt,
        # mobile/pubspec.lock and videos/package-lock.json. The table goes to
        # the job summary, so it needs neither code scanning nor artifact
        # storage. Exit code 1 means "vulnerabilities found": reported, not
        # failed, until the first results are triaged (then fail on 1). Any
        # other non-zero code is a scanner or network error and fails the job.
        run: |
          set +e
          ./osv-scanner scan source --recursive --format markdown --output osv.md .
          rc=$?
          set -e
          if [ -f osv.md ]; then
            cat osv.md
            { echo "## OSV-Scanner"; echo; cat osv.md; } >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$rc" -eq 1 ]; then
            echo "::warning::OSV-Scanner found known vulnerabilities; see the job summary."
            exit 0
          fi
          exit "$rc"
