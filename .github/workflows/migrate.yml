name: Apply DB migrations

# Manual-trigger only. Vercel's own vercel-build script already runs
# `prisma migrate deploy` on every production deployment (see package.json) —
# this workflow used to also auto-run on every push to main, meaning two
# independent processes applied migrations against the same database on
# every push. That's redundant at best and a race condition at worst.
# Keep this as a manual break-glass tool (e.g. to apply migrations ahead of
# a deploy, or re-run one that failed) rather than a second automatic path.
on:
  workflow_dispatch:

jobs:
  migrate:
    name: prisma migrate deploy
    runs-on: ubuntu-latest
    env:
      # Use MIGRATION_DATABASE_URL (Supabase session-mode pooler, port 5432 on pooler.supabase.com)
      # when the direct connection is blocked from GitHub Actions (IPv4 restriction on Supabase free tier).
      # Falls back to DATABASE_URL if MIGRATION_DATABASE_URL is not set.
      DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL || secrets.DATABASE_URL }}
      NO_COLOR: "1"
    steps:
      - name: Validate MIGRATION_DATABASE_URL secret
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Add MIGRATION_DATABASE_URL to GitHub Actions secrets."
            echo "::error::Use the Supabase Session Mode pooler URL (Settings → Database → Connection Pooling → Session mode)."
            echo "::error::It looks like: postgresql://postgres.PROJECTREF:PASSWORD@aws-0-REGION.pooler.supabase.com:5432/postgres"
            exit 1
          fi
          # Log host only (no credentials) to confirm pooler vs direct connection.
          DB_HOST=$(echo "$DATABASE_URL" | sed -E 's|.*@([^:/]+).*|\1|')
          echo "Connecting via host: $DB_HOST"

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.3

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma generate

      - name: Apply new migrations
        run: pnpm prisma migrate deploy
