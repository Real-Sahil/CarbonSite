name: Apply DB migrations

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  migrate:
    name: prisma migrate deploy
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      NO_COLOR: "1"
    steps:
      - name: Validate DATABASE_URL secret
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Add your Supabase connection string as a GitHub Actions secret named DATABASE_URL (Settings → Secrets → Actions)."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.3

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma generate

      - name: Show migration status
        continue-on-error: true
        run: pnpm prisma migrate status

      - name: Apply migrations
        run: pnpm prisma migrate deploy
