name: Apply DB migrations

# Runs on every push to main AND can be triggered manually.
# vercel-build only runs `prisma generate` — it does NOT run `prisma migrate deploy`.
# This workflow is therefore the primary path that applies schema changes to production.
# REQUIRED secrets:
#   MIGRATION_DATABASE_URL  — Supabase session-mode pooler URL (Settings -> Database ->
#                             Connection Pooling -> Session mode, port 5432).
#                             Falls back to DATABASE_URL when absent.
#   Both DATABASE_URL and DIRECT_URL are set to the same session-mode pooler URL so
#   Prisma schema validation (which requires DIRECT_URL) succeeds without needing a
#   separate direct-connection secret in GitHub Actions.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  migrate:
    name: prisma migrate deploy
    runs-on: ubuntu-latest
    env:
      # Use MIGRATION_DATABASE_URL (Supabase session-mode pooler, port 5432 on pooler.supabase.com)
      # when the direct connection is blocked from GitHub Actions (IPv4 restriction on Supabase free tier).
      # Falls back to DATABASE_URL if MIGRATION_DATABASE_URL is not set.
      DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL || secrets.DATABASE_URL }}
      # DIRECT_URL must be set (schema.prisma declares directUrl = env("DIRECT_URL")).
      # For migrations we use the same session-mode pooler URL as DATABASE_URL — it
      # supports DDL and bypasses pgBouncer transaction-mode limitations.
      DIRECT_URL: ${{ secrets.MIGRATION_DATABASE_URL || secrets.DATABASE_URL }}
      NO_COLOR: "1"
    steps:
      - name: Validate MIGRATION_DATABASE_URL secret
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Add MIGRATION_DATABASE_URL to GitHub Actions secrets."
            echo "::error::Use the Supabase Session Mode pooler URL (Settings → Database → Connection Pooling → Session mode)."
            echo "::error::It looks like: postgresql://postgres.PROJECTREF:PASSWORD@aws-0-REGION.pooler.supabase.com:5432/postgres"
            exit 1
          fi
          # Log host only (no credentials) to confirm pooler vs direct connection.
          DB_HOST=$(echo "$DATABASE_URL" | sed -E 's|.*@([^:/]+).*|\1|')
          echo "Connecting via host: $DB_HOST"

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.3

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma generate

      - name: Resolve any blocked failed migrations (P3009/P3018 recovery)
        run: |
          # 20260920000003_stakeholder_phase2: failed due to FK ordering bug
          # (programme_id FK before CREATE TABLE programmes). Marked rolled-back;
          # 20260922000001_stakeholder_phase2_retry re-applies the corrected SQL.
          pnpm prisma migrate resolve --rolled-back 20260920000003_stakeholder_phase2 2>&1 || true

          # 20260921000001_reusable_invite_link: adds "reusable" column to invite_links.
          # Column already existed in DB before this migration ran → 42701 duplicate.
          # Mark as applied (schema state already matches what this migration would do).
          pnpm prisma migrate resolve --applied 20260921000001_reusable_invite_link 2>&1 || true

          # 20260922000001_stakeholder_phase2_retry: failed with 42601 syntax error —
          # ADD CONSTRAINT IF NOT EXISTS is invalid Postgres syntax. Fixed with DO block.
          # Mark as rolled-back so next deploy re-applies the corrected SQL.
          pnpm prisma migrate resolve --rolled-back 20260922000001_stakeholder_phase2_retry 2>&1 || true

          # 20260922000000_sv_foundation: failed in production (P3009). CREATE TYPE used
          # non-idempotent syntax. Mark as rolled-back; 20260922000002_sv_foundation_idempotent
          # re-applies the same schema changes with full IF NOT EXISTS / DO block guards.
          pnpm prisma migrate resolve --rolled-back 20260922000000_sv_foundation 2>&1 || true

      - name: Apply new migrations
        run: pnpm prisma migrate deploy
