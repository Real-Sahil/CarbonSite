name: Uptime

# Checks production from outside every 15 minutes (GitHub may start a
# scheduled run a few minutes late). A check that fails three times in a row,
# 20 seconds apart, opens one issue labelled "uptime" (never a duplicate) and
# comments on it while the outage lasts; the first passing run closes it.
# GitHub emails the issue to watchers, so an outage reaches a person without
# any paid monitoring service. The repository is public, so these runs use no
# paid Actions minutes.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: uptime
  cancel-in-progress: false

jobs:
  check:
    name: Production checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BASE_URL: ${{ vars.METRICORA_API_BASE_URL || 'https://www.metricora.co.uk' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check pages and the health endpoint
        id: checks
        run: |
          failures=""
          check() { # name, path, expected body text (optional)
            local name="$1" path="$2" expect="${3:-}" code body
            for attempt in 1 2 3; do
              body=$(curl -sS -L --max-time 20 -o - -w '\n%{http_code}' "$BASE_URL$path" 2>/dev/null) || body=$'\n000'
              code="${body##*$'\n'}"
              if [ "$code" = "200" ] && { [ -z "$expect" ] || grep -q "$expect" <<<"$body"; }; then
                echo "ok    $name ($path)"
                return 0
              fi
              [ "$attempt" -lt 3 ] && sleep 20
            done
            local why="HTTP $code"
            [ "$code" = "200" ] && why="HTTP 200 but the response did not contain $expect"
            echo "FAIL  $name ($path): $why"
            failures="$failures- $name (\`$path\`): $why"$'\n'
          }
          check "Home page" "/"
          check "Sign in" "/sign-in"
          check "API and database" "/api/health" '"status":"ok"'
          {
            echo "failures<<EOF"
            printf '%s' "$failures"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Open or update the outage issue
        if: steps.checks.outputs.failures != ''
        env:
          FAILURES: ${{ steps.checks.outputs.failures }}
        run: |
          gh label create uptime --repo "$GITHUB_REPOSITORY" --color B60205 --description "Production outage raised by the uptime workflow" 2>/dev/null || true
          open=$(gh issue list --repo "$GITHUB_REPOSITORY" --label uptime --state open --json number --jq '.[0].number')
          run="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [ -z "$open" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" --label uptime \
              --title "Production check failing: $BASE_URL" \
              --body "$(printf 'These checks failed three times in a row at %s:\n\n%s\nRun: %s\n\nThis issue closes itself when the checks pass again.' "$(date -u '+%Y-%m-%d %H:%M UTC')" "$FAILURES" "$run")"
          else
            gh issue comment "$open" --repo "$GITHUB_REPOSITORY" \
              --body "$(printf 'Still failing at %s:\n\n%s\nRun: %s' "$(date -u '+%Y-%m-%d %H:%M UTC')" "$FAILURES" "$run")"
          fi
          exit 1

      - name: Close the outage issue on recovery
        if: steps.checks.outputs.failures == ''
        run: |
          open=$(gh issue list --repo "$GITHUB_REPOSITORY" --label uptime --state open --json number --jq '.[0].number')
          if [ -n "$open" ]; then
            gh issue close "$open" --repo "$GITHUB_REPOSITORY" \
              --comment "Checks passing again at $(date -u '+%Y-%m-%d %H:%M UTC')."
          fi
