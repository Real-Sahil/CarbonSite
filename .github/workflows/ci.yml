name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

jobs:
  web:
    name: Web — lint / typecheck / test / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma generate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/carbonsite
          STORAGE_DRIVER: local
          STORAGE_ENDPOINT: https://example.r2.cloudflarestorage.com
          STORAGE_ACCESS_KEY_ID: placeholder
          STORAGE_SECRET_ACCESS_KEY: placeholder
          STORAGE_BUCKET: carbonsite
          BETTER_AUTH_SECRET: placeholder-secret-32-chars-minimum!!
          BETTER_AUTH_URL: http://localhost:3000
          EMAIL_DRIVER: console
          TRUSTED_ORIGINS: http://localhost:3000

  android:
    name: Android — release APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Android toolchain requires JDK 17
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.x"
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Generate code (drift)
        working-directory: mobile
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        working-directory: mobile
        run: flutter analyze --no-fatal-infos

      - name: Build release APK (debug-signed for CI)
        working-directory: mobile
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: carbonsite-release-${{ github.sha }}
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
