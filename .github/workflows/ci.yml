name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# METRICORA_API_BASE_URL must be set as a GitHub repository variable
# (Settings → Variables) pointing at the production web app, e.g.:
#   https://www.metricora.co.uk
# CI falls back to https://www.metricora.co.uk when the variable is not set.
env:
  METRICORA_API_BASE_URL: ${{ vars.METRICORA_API_BASE_URL || 'https://www.metricora.co.uk' }}

jobs:
  web:
    name: Web — lint / typecheck / test / build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Real Postgres so migrations, the migrate-diff drift gate, and tests run
    # against an actual schema instead of never touching a database at all.
    # This is what would have caught the forecasts/causal_inference_runs/
    # airbite_connectors gaps in CI instead of in production.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: metricora
          POSTGRES_PASSWORD: metricora
          POSTGRES_DB: metricora_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://metricora:metricora@localhost:5432/metricora_test
      DIRECT_URL: postgresql://metricora:metricora@localhost:5432/metricora_test
      STORAGE_DRIVER: local
      STORAGE_ENDPOINT: https://example.r2.cloudflarestorage.com
      STORAGE_ACCESS_KEY_ID: placeholder
      STORAGE_SECRET_ACCESS_KEY: placeholder
      STORAGE_BUCKET: metricora
      BETTER_AUTH_SECRET: placeholder-secret-32-chars-minimum!!
      BETTER_AUTH_URL: http://localhost:3000
      EMAIL_DRIVER: console
      TRUSTED_ORIGINS: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      JOB_PROCESSING_MODE: inline
      ROUTING_PROVIDER: none
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma generate
      # Fail on high/critical severity advisories (Cyber Essentials patch-management control).
      # Run pnpm audit --prod locally and upgrade affected packages if this step fails.
      # --ignore-unfixable skips advisories where no patched version exists on the registry
      # (e.g. xlsx prototype-pollution / ReDoS — tracked in dependency audit backlog for replacement).
      - run: pnpm audit --prod --audit-level=high --ignore-unfixable
      - run: pnpm lint
        continue-on-error: true
      - run: pnpm typecheck
      - name: Apply all migrations to a fresh database
        # This is the gate that actually matters: it proves every migration file
        # applies cleanly, in order, to a database that's never seen any of them —
        # exactly what a fresh Vercel deploy, a new dev clone, or disaster recovery
        # does. Getting this step to pass required fixing ~15 pre-existing broken
        # migrations (UUID/TEXT type mismatches, PascalCase table names that don't
        # match @@map values, wrong migration ordering, duplicate/superseded
        # attempts) that had been silently marked "applied" in production despite
        # never having actually created their tables.
        run: pnpm prisma migrate deploy
      - name: Destructive migrations must be a separate contract step
        run: node scripts/check-migration-safety.mjs
      - name: Schema drift must not grow
        # schema.prisma and the applied migrations differ by a pre-existing
        # backlog (prisma/drift-baseline.txt). Fail only if a change adds to it;
        # lower the baseline as the backlog is cleared.
        run: |
          pnpm prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --script > drift.sql
          node scripts/check-migration-safety.mjs --drift < drift.sql
      - name: Seed reference data
        # Categories, methodology and factor libraries, then the factor-loading
        # migrations replayed (they insert nothing before categories exist).
        run: pnpm prisma db seed
      - name: Unit, integration and golden-number tests
        # RUN_DB_TESTS runs tests/golden: a UK inventory calculated end to end
        # against the seeded libraries and checked against hand-worked values.
        run: pnpm test
        env:
          RUN_DB_TESTS: "1"
      - run: pnpm build

  smoke:
    name: Smoke — Playwright e2e
    runs-on: ubuntu-latest
    needs: web
    timeout-minutes: 15
    env:
      # env context is unavailable in job-level env blocks; reference vars directly.
      # PLAYWRIGHT_BROWSERS_PATH/PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD are deliberately NOT
      # set here: that fixed /opt/pw-browsers path only exists in the Claude Code
      # sandbox's pre-installed Chromium. On GitHub-hosted runners it doesn't exist,
      # so playwright.config.ts's executablePath override would point at a binary
      # that was never installed. Let Playwright use its own default cache path,
      # which the "Install Playwright browsers" step below populates.
      PLAYWRIGHT_BASE_URL: ${{ vars.METRICORA_API_BASE_URL || 'https://www.metricora.co.uk' }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm playwright install chromium --with-deps
      - name: Run smoke tests
        run: pnpm playwright test

  e2e-local:
    name: E2E — pilot cycle on a local app
    runs-on: ubuntu-latest
    needs: web
    timeout-minutes: 25
    # The whole user cycle (tests/e2e/pilot-cycle.spec.ts) against a production
    # build on a throwaway, migrated and seeded Postgres: sign-up, records,
    # calculation totals, publish, PDF report, field submission approval,
    # role boundaries and a cross-tenant attempt.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: metricora
          POSTGRES_PASSWORD: metricora
          POSTGRES_DB: metricora_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://metricora:metricora@localhost:5432/metricora_e2e
      DIRECT_URL: postgresql://metricora:metricora@localhost:5432/metricora_e2e
      STORAGE_DRIVER: local
      STORAGE_ENDPOINT: https://example.r2.cloudflarestorage.com
      STORAGE_ACCESS_KEY_ID: placeholder
      STORAGE_SECRET_ACCESS_KEY: placeholder
      STORAGE_BUCKET: metricora
      BETTER_AUTH_SECRET: placeholder-secret-32-chars-minimum!!
      BETTER_AUTH_URL: http://localhost:3000
      EMAIL_DRIVER: console
      TRUSTED_ORIGINS: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      JOB_PROCESSING_MODE: inline
      ROUTING_PROVIDER: none
      E2E_LOCAL: "1"
      PLAYWRIGHT_BASE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma generate
      - run: pnpm prisma migrate deploy
      - run: pnpm prisma db seed
      - run: pnpm build
      - name: Start the app
        run: |
          nohup pnpm start > next.log 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:3000/sign-in && exit 0; sleep 2; done
          cat next.log; exit 1
      - name: Install Playwright browsers
        run: pnpm playwright install chromium --with-deps
      - name: Run the pilot cycle
        run: pnpm playwright test tests/e2e/pilot-cycle.spec.ts
      - name: App log on failure
        if: failure()
        run: tail -200 next.log

  forecast:
    name: Forecast — Python unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pytest api/ -v

  android:
    name: Android — release APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      # Android toolchain requires JDK 17
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          # Matches mobile-build.yml. image_cropper_platform_interface calls
          # Color.toARGB32(), added to dart:ui in Flutter 3.29 — 3.27.x fails
          # to compile it during `flutter test`.
          flutter-version: "3.44.0"
          channel: stable
          cache: true

      - name: Inject google-services.json
        working-directory: mobile
        env:
          METRICORA_GOOGLE_SERVICES_JSON: ${{ secrets.METRICORA_GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$METRICORA_GOOGLE_SERVICES_JSON" ]; then
            echo "$METRICORA_GOOGLE_SERVICES_JSON" > android/app/google-services.json
          fi
          # If the file is still missing (no secret set), the committed stub is used automatically.

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      # Upgrade generators to the latest major that bundles an analyzer
      # compatible with the installed Dart SDK before running build_runner.
      # drift_dev is included so its bundled analyzer handles Dart 3.7+
      # dot-shorthand AST nodes (visitDotShorthandPropertyAccess); drift
      # runtime and sqlite3_flutter_libs are upgraded in lockstep.
      - name: Upgrade generators for installed Dart SDK
        working-directory: mobile
        run: flutter pub upgrade --major-versions build_runner freezed json_serializable freezed_annotation json_annotation drift_dev drift sqlite3_flutter_libs

      - name: Generate code (drift)
        working-directory: mobile
        timeout-minutes: 10
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        working-directory: mobile
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        working-directory: mobile
        run: flutter test

      - name: Build release APK
        working-directory: mobile
        run: flutter build apk --release --dart-define=METRICORA_API_BASE_URL="$METRICORA_API_BASE_URL"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: metricora-android-${{ github.sha }}
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
