name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

# CARBONSITE_API_BASE_URL must be set as a GitHub repository variable
# (Settings → Variables) pointing at the production web app, e.g.:
#   https://carbonsite-rosy.vercel.app
# CI falls back to https://carbonsite-rosy.vercel.app when the variable is not set.
env:
  CARBONSITE_API_BASE_URL: ${{ vars.CARBONSITE_API_BASE_URL || 'https://carbonsite-rosy.vercel.app' }}

jobs:
  web:
    name: Web — lint / typecheck / test / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma generate
      # Non-blocking until known advisories are triaged; tighten once the
      # dependency tree is clean (Cyber Essentials patch-management control).
      - run: pnpm audit --prod
        continue-on-error: true
      - run: pnpm lint
        continue-on-error: true
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/carbonsite
          DIRECT_DATABASE_URL: postgresql://user:password@localhost:5432/carbonsite
          STORAGE_DRIVER: local
          STORAGE_ENDPOINT: https://example.r2.cloudflarestorage.com
          STORAGE_ACCESS_KEY_ID: placeholder
          STORAGE_SECRET_ACCESS_KEY: placeholder
          STORAGE_BUCKET: carbonsite
          BETTER_AUTH_SECRET: placeholder-secret-32-chars-minimum!!
          BETTER_AUTH_URL: http://localhost:3000
          EMAIL_DRIVER: console
          TRUSTED_ORIGINS: http://localhost:3000
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          JOB_PROCESSING_MODE: inline
          ROUTING_PROVIDER: none

  android:
    name: Android — release APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Android toolchain requires JDK 17
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.x"
          channel: stable
          cache: true

      - name: Inject google-services.json
        working-directory: mobile
        env:
          CARBONSITE_GOOGLE_SERVICES_JSON: ${{ secrets.CARBONSITE_GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$CARBONSITE_GOOGLE_SERVICES_JSON" ]; then
            echo "$CARBONSITE_GOOGLE_SERVICES_JSON" > android/app/google-services.json
          fi
          # If the file is still missing (no secret set), the committed stub is used automatically.

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Generate code (drift)
        working-directory: mobile
        timeout-minutes: 10
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        working-directory: mobile
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        working-directory: mobile
        run: flutter test

      - name: Build release APK
        working-directory: mobile
        run: flutter build apk --release --dart-define=CARBONSITE_API_BASE_URL="$CARBONSITE_API_BASE_URL"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: carbonsite-android-${{ github.sha }}
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
