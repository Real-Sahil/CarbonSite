name: CI

# One run per change: pull requests run on the pull_request event and main on
# push. Branch pushes used to trigger a second, identical push run (and the
# two runs sat in different concurrency groups, so neither cancelled the
# other). A newer push to the same PR cancels the older run.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# METRICORA_API_BASE_URL must be set as a GitHub repository variable
# (Settings → Variables) pointing at the production web app, e.g.:
#   https://www.metricora.co.uk
# CI falls back to https://www.metricora.co.uk when the variable is not set.
env:
  METRICORA_API_BASE_URL: ${{ vars.METRICORA_API_BASE_URL || 'https://www.metricora.co.uk' }}

jobs:
  web:
    name: Web — lint / typecheck / test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Real Postgres so migrations, the migrate-diff drift gate, and tests run
    # against an actual schema instead of never touching a database at all.
    # This is what would have caught the forecasts/causal_inference_runs/
    # airbite_connectors gaps in CI instead of in production.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: metricora
          POSTGRES_PASSWORD: metricora
          POSTGRES_DB: metricora_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://metricora:metricora@localhost:5432/metricora_test
      DIRECT_URL: postgresql://metricora:metricora@localhost:5432/metricora_test
      STORAGE_DRIVER: local
      STORAGE_ENDPOINT: https://example.r2.cloudflarestorage.com
      STORAGE_ACCESS_KEY_ID: placeholder
      STORAGE_SECRET_ACCESS_KEY: placeholder
      STORAGE_BUCKET: metricora
      BETTER_AUTH_SECRET: placeholder-secret-32-chars-minimum!!
      BETTER_AUTH_URL: http://localhost:3000
      EMAIL_DRIVER: console
      TRUSTED_ORIGINS: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      JOB_PROCESSING_MODE: inline
      ROUTING_PROVIDER: none
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma generate
      # Fail on high/critical severity advisories (Cyber Essentials patch-management control).
      # Run pnpm audit --prod locally and upgrade affected packages if this step fails.
      # --ignore-unfixable skips advisories where no patched version exists on the registry
      # (e.g. xlsx prototype-pollution / ReDoS — tracked in dependency audit backlog for replacement).
      - run: pnpm audit --prod --audit-level=high --ignore-unfixable
      - run: pnpm lint
      - name: No unused files or dependencies (Knip)
        run: pnpm knip
        continue-on-error: true
      - run: pnpm typecheck
      - name: Apply all migrations to a fresh database
        # This is the gate that actually matters: it proves every migration file
        # applies cleanly, in order, to a database that's never seen any of them —
        # exactly what a fresh Vercel deploy, a new dev clone, or disaster recovery
        # does. Getting this step to pass required fixing ~15 pre-existing broken
        # migrations (UUID/TEXT type mismatches, PascalCase table names that don't
        # match @@map values, wrong migration ordering, duplicate/superseded
        # attempts) that had been silently marked "applied" in production despite
        # never having actually created their tables.
        run: pnpm prisma migrate deploy
      - name: Destructive migrations must be a separate contract step
        run: node scripts/check-migration-safety.mjs
      - name: Schema drift must not grow
        # schema.prisma and the applied migrations differ by a pre-existing
        # backlog (prisma/drift-baseline.txt). Fail only if a change adds to it;
        # lower the baseline as the backlog is cleared.
        run: |
          pnpm prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --script > drift.sql
          node scripts/check-migration-safety.mjs --drift < drift.sql
      - name: Seed reference data
        # Categories, methodology and factor libraries, then the factor-loading
        # migrations replayed (they insert nothing before categories exist).
        run: pnpm prisma db seed
      - name: Unit, integration and golden-number tests
        # RUN_DB_TESTS runs tests/golden: a UK inventory calculated end to end
        # against the seeded libraries and checked against hand-worked values.
        run: pnpm test
        env:
          RUN_DB_TESTS: "1"
      # No build here: the e2e-local job runs the production build it tests.

  e2e-local:
    name: Build + E2E on a local app
    runs-on: ubuntu-latest
    needs: web
    timeout-minutes: 25
    # The production build of this change, then every Playwright spec against
    # it on a throwaway, migrated and seeded Postgres: the pilot user cycle
    # (sign-up, records, calculation totals, publish, PDF report, field
    # submission approval, role boundaries, a cross-tenant attempt), the smoke
    # checks and WCAG 2.1 A/AA on the public pages. Production itself is
    # watched by uptime.yml, so no job here points at the live site.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: metricora
          POSTGRES_PASSWORD: metricora
          POSTGRES_DB: metricora_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://metricora:metricora@localhost:5432/metricora_e2e
      DIRECT_URL: postgresql://metricora:metricora@localhost:5432/metricora_e2e
      STORAGE_DRIVER: local
      STORAGE_ENDPOINT: https://example.r2.cloudflarestorage.com
      STORAGE_ACCESS_KEY_ID: placeholder
      STORAGE_SECRET_ACCESS_KEY: placeholder
      STORAGE_BUCKET: metricora
      BETTER_AUTH_SECRET: placeholder-secret-32-chars-minimum!!
      BETTER_AUTH_URL: http://localhost:3000
      EMAIL_DRIVER: console
      TRUSTED_ORIGINS: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      JOB_PROCESSING_MODE: inline
      ROUTING_PROVIDER: none
      E2E_LOCAL: "1"
      PLAYWRIGHT_BASE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma generate
      - run: pnpm prisma migrate deploy
      - run: pnpm prisma db seed
      - run: pnpm build
      - name: Start the app
        run: |
          nohup pnpm start > next.log 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:3000/sign-in && exit 0; sleep 2; done
          cat next.log; exit 1
      - name: Install Playwright browsers
        run: pnpm playwright install chromium --with-deps
      - name: Pilot cycle, smoke and accessibility (axe-core) specs
        run: pnpm playwright test
      - name: App log on failure
        if: failure()
        run: tail -200 next.log

  forecast:
    name: Forecast — Python unit tests
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pytest api/ -v

  # Which optional suites this change needs. Mobile builds are not part of CI:
  # Android and iOS release builds run only from mobile-build.yml, on a
  # mobile-v* / v* tag or a manual dispatch. CI analyses and tests the Flutter
  # app only when mobile/ changed, and runs the Python forecast tests only when
  # api/ or the Python requirements changed.
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mobile: ${{ steps.diff.outputs.mobile }}
      python: ${{ steps.diff.outputs.python }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # No usable base (manual run, new branch): check the app anyway.
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "mobile=true" >> "$GITHUB_OUTPUT"
            echo "python=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$BASE" HEAD)
          if grep -qE '^(mobile/|\.github/workflows/ci\.yml$)' <<<"$changed"; then
            echo "mobile=true" >> "$GITHUB_OUTPUT"
          else
            echo "mobile=false" >> "$GITHUB_OUTPUT"
          fi
          if grep -qE '^(api/|requirements(-dev)?\.txt$|\.github/workflows/ci\.yml$)' <<<"$changed"; then
            echo "python=true" >> "$GITHUB_OUTPUT"
          else
            echo "python=false" >> "$GITHUB_OUTPUT"
          fi

  mobile:
    name: Mobile — analyze / test
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # Matches mobile-build.yml.
          flutter-version: "3.44.0"
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      # Same generator upgrade as mobile-build.yml, so drift's analyzer
      # understands the installed Dart SDK.
      - name: Upgrade generators for installed Dart SDK
        working-directory: mobile
        run: flutter pub upgrade --major-versions build_runner freezed json_serializable freezed_annotation json_annotation drift_dev drift sqlite3_flutter_libs

      - name: Generate code (drift)
        working-directory: mobile
        timeout-minutes: 10
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        working-directory: mobile
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        working-directory: mobile
        run: flutter test
