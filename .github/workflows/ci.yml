name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: Web — lint / typecheck / test / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
        env:
          # Provide dummy env vars for build-time validation
          DATABASE_URL: postgresql://user:password@localhost:5432/carbonsite
          REDIS_URL: redis://localhost:6379
          STORAGE_ENDPOINT: https://example.r2.cloudflarestorage.com
          STORAGE_ACCESS_KEY_ID: placeholder
          STORAGE_SECRET_ACCESS_KEY: placeholder
          STORAGE_BUCKET: carbonsite
          BETTER_AUTH_SECRET: placeholder-secret-32-chars-minimum!!
          BETTER_AUTH_URL: http://localhost:3000

  flutter:
    name: Flutter — analyze / test / build
    runs-on: ubuntu-latest
    if: hashFiles('mobile/pubspec.yaml') != ''
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.x"
          channel: stable
          cache: true
      - working-directory: mobile
        run: flutter pub get
      - working-directory: mobile
        run: flutter analyze
      - working-directory: mobile
        run: flutter test
