name: Database backup

# Nightly encrypted backup of the production database to a private Supabase
# Storage bucket, and a weekly restore drill that proves the latest backup
# restores and matches its row-count manifest. Supabase's free tier has no
# point-in-time recovery, so this is the recovery path. A failure of either
# job emails the repository owner (GitHub notifies on failed scheduled runs).
#
# Secrets (Settings -> Secrets and variables -> Actions):
#   MIGRATION_DATABASE_URL or DATABASE_URL  Supabase session-mode pooler URL
#   BACKUP_PASSPHRASE          long random passphrase; keep a copy outside
#                              GitHub, without it the backups cannot be decrypted
#   SUPABASE_URL               https://<project ref>.supabase.co
#   SUPABASE_SERVICE_ROLE_KEY  service role key (Project Settings -> API keys)
#
# Bucket: "backups" (private, created by migration 20260924000033). The
# service role key reaches it through the Storage API; no other role can.
# Layout: db/daily/<stamp>.* (pruned after 35 days by this workflow),
# db/monthly/<stamp>.* on the 1st of each month (kept), db/latest.txt.
# Supabase's free plan caps one upload at 50 MB and the project's storage at
# 1 GB; the upload step fails loudly before either is a surprise.
#
# Restore by hand: download the .dump.gpg from Storage -> backups, then
#   gpg --decrypt metricora-<stamp>.dump.gpg > backup.dump
#   pg_restore --no-owner --no-privileges --dbname "$TARGET_URL" backup.dump

on:
  schedule:
    - cron: "30 2 * * *"   # backup, daily 02:30 UTC
    - cron: "0 5 * * 0"    # restore drill, Sundays 05:00 UTC
  workflow_dispatch:
    inputs:
      job:
        description: What to run
        type: choice
        options: [backup, drill, both]
        default: both

concurrency:
  group: database-backup
  cancel-in-progress: false

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  BACKUP_BUCKET: backups
  BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}

jobs:
  backup:
    if: github.event.schedule == '30 2 * * *' || (github.event_name == 'workflow_dispatch' && inputs.job != 'drill')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL || secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Check secrets
        run: |
          for v in DATABASE_URL BACKUP_PASSPHRASE SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY; do
            if [ -z "${!v}" ]; then echo "::error::Missing secret for $v (see the header of backup.yml)"; missing=1; fi
          done
          [ -z "$missing" ]
      - name: Install PostgreSQL 17 client
        run: |
          sudo apt-get install -y -q postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -q postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
      - name: Dump, count and encrypt
        run: OUT_DIR=backup-out scripts/backup/dump.sh
      - name: Upload to Supabase Storage
        run: |
          source scripts/backup/storage.sh
          STAMP="$(cat backup-out/latest.txt)"
          SIZE="$(stat -c %s "backup-out/metricora-$STAMP.dump.gpg")"
          if [ "$SIZE" -gt $((50 * 1024 * 1024)) ]; then
            echo "::error::Archive is $((SIZE / 1024 / 1024)) MB, over the 50 MB upload limit of Supabase's free plan. Raise the limit (Pro plan) or split the dump."
            exit 1
          fi
          for prefix in db/daily $( [ "$(date -u +%d)" = "01" ] && echo db/monthly ); do
            storage_put "backup-out/metricora-$STAMP.dump.gpg" "$prefix/metricora-$STAMP.dump.gpg"
            storage_put "backup-out/manifest-$STAMP.csv" "$prefix/manifest-$STAMP.csv"
          done
          storage_put backup-out/latest.txt db/latest.txt
          echo "Uploaded $STAMP ($((SIZE / 1024)) KB)"
      - name: Prune daily backups older than 35 days
        run: |
          source scripts/backup/storage.sh
          storage_prune db/daily 35

  drill:
    needs: [backup]
    # After a manual backup in the same dispatch; on its own schedule the
    # backup job is skipped, which must not block the drill.
    if: >-
      always() && needs.backup.result != 'failure' &&
      (github.event.schedule == '0 5 * * 0' || (github.event_name == 'workflow_dispatch' && inputs.job != 'backup'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: restore
          POSTGRES_PASSWORD: restore
          POSTGRES_DB: restore
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      RESTORE_URL: postgresql://restore:restore@localhost:5432/restore
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL 17 client
        run: |
          sudo apt-get install -y -q postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -q postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
      - name: Download the latest backup
        run: |
          source scripts/backup/storage.sh
          storage_get db/latest.txt latest.txt
          STAMP="$(cat latest.txt)"
          storage_get "db/daily/metricora-$STAMP.dump.gpg" backup.dump.gpg
          storage_get "db/daily/manifest-$STAMP.csv" manifest.csv
          echo "Backup $STAMP"
      - name: Restore and verify
        run: ARCHIVE=backup.dump.gpg MANIFEST=manifest.csv scripts/backup/restore-drill.sh
